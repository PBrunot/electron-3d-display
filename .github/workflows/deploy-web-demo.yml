name: Deploy web demo to GitHub Pages

# web/index.html fetches its shared model files straight from micropython/
# and pc/ at runtime (see web/index.html's PY_FILES list) -- there is no
# separate "web build" of those files to compile, only an assembly step:
# copy web/, micropython/, and pc/ into one publish directory so the site's
# relative fetch("../micropython/...")/fetch("../pc/...") calls resolve
# exactly as they do when served locally from the repo root (see
# web/README.md for local testing instructions).
#
# docs/*.html are the standalone generated calculation-pipeline writeups
# (coefficients_to_tables, tables_to_bin, tables_to_pointclouds); they're
# copied to /docs/ with a tagged FabLab article link on every published page.

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'index.html'
      - 'it/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'tools/education_pages_gen.py'
      - 'tools/assemble_web_site.py'
      - 'micropython/**'
      - 'pc/**'
      - 'docs/**'
      - '.github/workflows/deploy-web-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push should win rather than
# queue behind an older, already-superseded one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate educational pages
        run: |
          python3 tools/education_pages_gen.py --check
          node web/shell_filling_model.test.js

      - name: Assemble site
        run: python3 tools/assemble_web_site.py _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
