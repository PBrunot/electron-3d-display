[env:WS-ESP32-S3-LCD-1-3]
platform = espressif32@6.5.0
board = WS-ESP32-S3-LCD-1-3
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI

; toolchain resta GCC 8.4.0 (bundled con espressif32@6.5.0, verificato stabile);
; qui alziamo solo lo standard C++ dal default gnu++11 a gnu++17, l'ultimo
; pienamente supportato da GCC 8 (C++20 su GCC 8 e' solo parziale: niente
; concepts, coroutine incomplete -> non affidabile su questo toolchain).
build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -I include
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_INVERSION_ON=1
    -D TFT_RGB_ORDER=1
    -D TFT_MOSI=41
    -D TFT_SCLK=40
    -D TFT_CS=39
    -D TFT_DC=38
    -D TFT_RST=42
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
