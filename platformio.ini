; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:WS_ESP32_S3_LCD_1_3]
platform = espressif32@7.0.1
board = WS-ESP32-S3-LCD-1-3
framework = espidf
monitor_speed = 115200
build_unflags = 
	-std=gnu++11
build_flags =
	-std=gnu++26
	-I include
	-I src
	-Wall
	-Wextra
build_src_flags =
	-fconstexpr-ops-limit=100000000
	-Wstack-usage=2048
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions_16M.csv
; ccache is wired in by the first script below, NOT by CMAKE_*_COMPILER_LAUNCHER:
; PlatformIO generates build.ninja but never runs ninja, so a CMake compiler
; launcher never executes. See tools/extra_script_ccache.py for the details.
; The second script chains `uploadfs` onto every `upload`, so a plain flash
; always also deploys the data/ directory (hfs_tables.bin, orbital_samplers.bin, ...)
; -- see tools/extra_script_uploadfs.py.
extra_scripts =
	pre:tools/extra_script_ccache.py
;	pre:tools/extra_script_uploadfs.py

; CYD (ESP32-2432S028R, "Cheap Yellow Display" --
; see https://github.com/witnessmenow/ESP32-Cheap-Yellow-Display). Builds the SAME src/ app as
; WS_ESP32_S3_LCD_1_3 -- render/display.cpp/.h branch on CONFIG_IDF_TARGET_ESP32 for the
; ILI9341/pin/resolution/no-PSRAM differences, ux/imu.cpp/main.cpp branch for the missing IMU.
; See CYD-branch.md for full status (pins, known gaps, memory layout).
[env:CYD]
platform = espressif32@7.0.1
board = esp32dev
framework = espidf
monitor_speed = 115200
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++26
	-I include
	-I src
	-Wall
	-Wextra
build_src_flags =
	-fconstexpr-ops-limit=100000000
	-Wstack-usage=2048
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions_cyd.csv
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults.CYD
; Plane-slice heatmap (Right tilt-hold) excluded outright, not just left unreachable: its
; per-build scratch (orbital_slice.cpp's sliceMag/sliceOrder, ~450KB at the current 240x240
; grid) alone overflowed this board's internal-RAM link budget (no PSRAM to fall back to),
; independent of any point-cloud-count tuning -- and the gesture that reaches it needs the
; IMU, which this board doesn't have anyway (ux/imu.cpp). See CYD-branch.md. `build_src_filter`
; is NOT the exclusion mechanism -- PlatformIO ignores that option under ESP-IDF (it warns
; "cannot be used with ESP-IDF"; src/CMakeLists.txt globs every file unconditionally). The
; actual exclusion is that views/orbital_view.cpp's/src/main.cpp's only call sites into
; orbital_slice.cpp are already `#if !CONFIG_IDF_TARGET_ESP32`, so the linker's
; --gc-sections drops the whole unreferenced translation unit (verified via `nm` on the
; linked ELF: no sliceMag/sliceOrder symbols present).
;
; Deploy data/ (hfs_tables.bin, orbital_samplers.bin, ...) to the CYD's own "storage" SPIFFS
; partition with `pio run -e CYD -t uploadfs_cyd` (NOT the built-in `uploadfs` -- that shells
; out to mkspiffs, whose prebuilt binary for this platform is armhf-only and won't run on an
; aarch64 build host; uploadfs_cyd below builds the same data/ directory via ESP-IDF's
; pure-Python spiffsgen.py instead and writes it directly via esptool. See CYD-branch.md).
; Not chained onto every upload here either, same manual-step convention as the S3 env above.
extra_scripts =
	pre:tools/extra_script_ccache.py
	pre:tools/extra_script_uploadfs_cyd.py

[platformio]
description = Atomic electron cloud viewer (orbitals and atoms) for ESP32
build_cache_dir = .pio/build_cache