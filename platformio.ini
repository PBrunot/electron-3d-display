; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:WS_ESP32_S3_LCD_1_3]
platform = espressif32@7.0.1
board = WS-ESP32-S3-LCD-1-3
framework = espidf
monitor_speed = 115200
build_unflags = 
	-std=gnu++11
build_flags =
	-std=gnu++26
	-I include
	-I src
	-Wall
	-Wextra
build_src_flags =
	-fconstexpr-ops-limit=100000000
	-Wstack-usage=2048
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions_16M.csv
; ccache is wired in by the first script below, NOT by CMAKE_*_COMPILER_LAUNCHER:
; PlatformIO generates build.ninja but never runs ninja, so a CMake compiler
; launcher never executes. See tools/extra_script_ccache.py for the details.
; The second script chains `uploadfs` onto every `upload`, so a plain flash
; always also deploys the data/ directory (hfs_tables.bin, orbital_samplers.bin, ...)
; -- see tools/extra_script_uploadfs.py.
extra_scripts =
	pre:tools/extra_script_ccache.py
	pre:tools/extra_script_uploadfs_s3.py
;	pre:tools/extra_script_uploadfs.py

; CYD (ESP32-2432S028R, "Cheap Yellow Display" --
; see https://github.com/witnessmenow/ESP32-Cheap-Yellow-Display). Builds the SAME src/ app as
; WS_ESP32_S3_LCD_1_3 -- render/display.cpp/.h branch on CONFIG_IDF_TARGET_ESP32 for the
; ILI9341/pin/resolution/no-PSRAM differences, ux/imu.cpp/main.cpp branch for the missing IMU.
; See CYD-branch.md for full status (pins, known gaps, memory layout).
[env:CYD]
platform = espressif32@7.0.1
board = esp32dev
framework = espidf
monitor_speed = 115200
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++26
	-I include
	-I src
	-Wall
	-Wextra
build_src_flags =
	-fconstexpr-ops-limit=100000000
	-Wstack-usage=2048
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions_cyd.csv
; CYD-specific sdkconfig overrides (4MB flash, no PSRAM) live in sdkconfig.defaults.esp32,
; NOT set here -- there is no PlatformIO project option that wires a per-env sdkconfig
; defaults file into the espidf build (board_build.esp-idf.sdkconfig_defaults, which used
; to be set here, is not read anywhere in this platform version's builder scripts; it was
; a silent no-op). ESP-IDF's own build system auto-appends
; "sdkconfig.defaults.$IDF_TARGET" after the base sdkconfig.defaults instead -- the esp32
; target name IS the wiring. See sdkconfig.defaults's header comment for the full story.
; Deploy data/ (hfs_tables.bin, orbital_samplers.bin, ...) to the CYD's own "storage" SPIFFS
; partition with `pio run -e CYD -t uploadfs_cyd` (NOT the built-in `uploadfs` -- that shells
; out to mkspiffs, whose prebuilt binary for this platform is armhf-only and won't run on an
; aarch64 build host; uploadfs_cyd below builds the same data/ directory via ESP-IDF's
; pure-Python spiffsgen.py instead and writes it directly via esptool. See CYD-branch.md).
; Not chained onto every upload here either, same manual-step convention as the S3 env above.
extra_scripts =
	pre:tools/extra_script_ccache.py
	pre:tools/extra_script_uploadfs_cyd.py

; QDtech ES3C28P/ES3N28P ("2.8inch IPS ESP32-S3 Display Module", see boards/cyd-esp32s3/ for
; datasheets). Same ESP32-S3 module class as WS_ESP32_S3_LCD_1_3 (16MB external QSPI flash,
; 8MB octal PSRAM on GPIO26/30 CS/CLK) -- sdkconfig.defaults.esp32s3's PSRAM pin config applies
; unchanged, and partitions_16M.csv fits as-is, so this env reuses both rather than forking them.
; Firmware pin wiring (render/display.cpp etc.) is NOT done yet -- this env only makes the board
; buildable; it currently builds the same src/ as WS_ESP32_S3_LCD_1_3, which targets the WRONG
; pinout/resolution for this board. Key facts for that follow-up work, from
; boards/cyd-esp32s3/ES3C28P_ES2N28P_Specification_V1.0.pdf section 4.2:
;   LCD (ILI9341V, 4-wire SPI, 240x320): CS=10 DC=46 SCLK=12 MOSI=11 MISO=13 BL=45
;     RST is shared with EN/CHIP_PU (no dedicated LCD reset pin).
;   Touch (ES3C28P only; FT6336G capacitive, I2C addr 0x38): SDA=16 SCL=15 RST=18 INT=17
;     (bus shared with the I2C peripheral expansion header and audio codec).
;   ES3N28P is the same board without the touch controller -- same pins/env otherwise.
;   RGB status LED (single-wire, built-in driver IC): GPIO42.
;   MicroSD (native SDIO, not SPI): CLK=38 CMD=40 D0=39 D1=41 D2=48 D3=47.
;   Battery voltage ADC: GPIO9. Buttons: BOOT=IO0, RESET=CHIP_PU/EN.
;   Expansion header (4 idle GPIOs): 2, 3, 14, 21.
[env:ES3C28P]
platform = espressif32@7.0.1
board = ES3C28P
framework = espidf
monitor_speed = 115200
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++26
	-I include
	-I src
	-Wall
	-Wextra
	; Distinguishes this board from WS_ESP32_S3_LCD_1_3 at compile time -- both target the same
	; esp32s3 chip, so CONFIG_IDF_TARGET_ESP32 alone can't tell them apart. See config/board.h.
	-DBOARD_ES3C28P=1
build_src_flags =
	-fconstexpr-ops-limit=100000000
	-Wstack-usage=2048
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions_16M.csv
extra_scripts =
	pre:tools/extra_script_ccache.py

[platformio]
description = Atomic electron cloud viewer (orbitals and atoms) for ESP32
build_cache_dir = .pio/build_cache