; Env name uses underscores, NOT "WS-ESP32-S3-LCD-1-3" - do not "fix" this back to hyphens.
; platform-espressif32@7.0.1's espidf.py builder (build_bootloader -> extract_link_args,
; ~line 408) strips linker "-L" prefixes via a global fragment.replace("-L", "") instead of
; a 2-char slice. Since $BUILD_DIR embeds the env name, a name containing "-LCD" gets its
; embedded "-L" eaten too, corrupting the bootloader.ld search path
; (".../WS-ESP32-S3-LCD-1-3/..." -> ".../WS-ESP32-S3CD-1-3/...") and breaking the bootloader
; link with "cannot open linker script file bootloader.ld". board= below is unaffected (board
; manifest lookup, not a build path) and stays hyphenated to match boards/WS-ESP32-S3-LCD-1-3.json.
[env:WS_ESP32_S3_LCD_1_3]
platform = espressif32@7.0.1
board = WS-ESP32-S3-LCD-1-3
framework = espidf
monitor_speed = 115200

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++26
    -I include