; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:WS_ESP32_S3_LCD_1_3]
platform = espressif32@7.0.1
board = WS-ESP32-S3-LCD-1-3
framework = espidf
monitor_speed = 115200
build_unflags = 
	-std=gnu++11
build_flags =
	-std=gnu++26
	-I include
	-Wall
	-Wextra
build_src_flags =
	-fconstexpr-ops-limit=100000000
	-Wstack-usage=2048
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions_16M.csv
; ccache is wired in by the first script below, NOT by CMAKE_*_COMPILER_LAUNCHER:
; PlatformIO generates build.ninja but never runs ninja, so a CMake compiler
; launcher never executes. See tools/extra_script_ccache.py for the details.
; The second script chains `uploadfs` onto every `upload`, so a plain flash
; always also deploys data/hfs_tables.bin -- see tools/extra_script_uploadfs.py.
extra_scripts =
	pre:tools/extra_script_ccache.py
	pre:tools/extra_script_uploadfs.py

[platformio]
description = Atomic electron cloud viewer (orbitals and atoms) for ESP32
build_cache_dir = .pio/build_cache